<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Card Frame -->
  <g filter="url(#shadow)">
    <rect x="76" y="86" width="360" height="340" rx="32" fill="#1e293b" stroke="#475569" stroke-width="6" />
  </g>

  <!-- Header Card Accent -->
  <path d="M 76 118 C 76 100 90 86 108 86 L 404 86 C 422 86 436 100 436 118 L 436 160 L 76 160 Z" fill="url(#cardGrad)" />
  
  <!-- Text lines representing the card items -->
  <rect x="116" y="112" width="140" height="22" rx="11" fill="#ffffff" opacity="0.95" />
  <circle cx="390" cy="123" r="12" fill="#93c5fd" />

  <rect x="116" y="196" width="280" height="20" rx="10" fill="#94a3b8" />
  <rect x="116" y="234" width="230" height="20" rx="10" fill="#64748b" />
  <rect x="116" y="272" width="260" height="20" rx="10" fill="#64748b" />

  <!-- Shield / Healthy Adult symbol at bottom right of card -->
  <g filter="url(#shadow)">
    <path d="M 330 290 Q 380 280 430 290 Q 430 360 380 410 Q 330 360 330 290 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4" />
    <!-- Checkmark inside shield -->
    <path d="M 356 345 L 374 365 L 406 325" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Flashcard badge at bottom left -->
  <rect x="116" y="330" width="150" height="38" rx="12" fill="#334155" stroke="#38bdf8" stroke-width="3" />
  <circle cx="140" cy="349" r="7" fill="#38bdf8" />
  <rect x="160" y="342" width="85" height="14" rx="7" fill="#e2e8f0" />
</svg>
